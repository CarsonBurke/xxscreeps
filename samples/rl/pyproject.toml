[project]
name = "xxscreeps-rl"
version = "0.1.0"
description = "ViT-style PPO agent for xxscreeps"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "tensorboard>=2.14",
]

[project.scripts]
xxscreeps-rl-train = "agent.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
